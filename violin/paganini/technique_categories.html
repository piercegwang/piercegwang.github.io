<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paganini Technique Categories</title>
<meta name="author" content="Pierce Wang" />
<meta name="description" content="Technique intensity map for Paganini's 24 Caprices by Pierce Wang. © Pierce Wang · piercewang.com" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://piercewang.com/emacs/org-heatmap.css" />
<link rel="stylesheet" href="technique_categories.css" />
<script src="https://piercewang.com/emacs/org-heatmap.js"></script>
</head>
<body>
<div id="content" class="content">
<div class="sheet">
<div class="title-block">
<h1 class="title">Paganini Technique Categories</h1>
<p class="subtitle">24 Caprices — Technique Use 0–10</p>
<div class="legend" aria-hidden="true">
<span>0 None</span>
<span class="legend-bar"></span>
<span>10 Extensive</span>
</div>
</div>
<div class="table-scroll">
<table class="heatmap-0-10" id="technique-table">
  <thead></thead>
  <tbody class="caprice-rows"></tbody>
  <tbody class="totals-row"></tbody>
</table>
</div>
<section class="coverage-panel" aria-labelledby="coverage-title">
  <div class="coverage-header">
    <h2 class="coverage-title" id="coverage-title">Selected coverage</h2>
    <p class="coverage-meta" id="coverage-count">0 caprices selected</p>
    <div class="coverage-actions">
      <button type="button" id="select-all-caprices">Select all</button>
      <button type="button" id="clear-caprice-selection">Clear</button>
    </div>
  </div>
  <p class="coverage-hint">Click rows above to select; click a coverage row to remove it.</p>
  <div class="coverage-scroll">
    <table class="coverage-sum heatmap-0-10" id="coverage-sum" aria-live="polite">
      <thead id="coverage-head"></thead>
      <tbody class="coverage-selected" id="coverage-body"></tbody>
      <tbody class="coverage-summary" id="coverage-summary"></tbody>
    </table>
  </div>
</section>
</div>
</div>
<div id="postamble" class="status">
<p class="credit">© Pierce Wang · <a href="https://piercewang.com">piercewang.com</a></p>
<p class="date">Created: 2026-06-27</p>
</div>
<div class="auth-stamp" aria-hidden="true">
  <div class="auth-stamp-inner">
    <span class="auth-stamp-mark">© Pierce Wang</span>
  </div>
</div>
<script src="technique_categories.js"></script>
</body>
</html>
